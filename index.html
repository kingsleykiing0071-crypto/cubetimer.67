<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Flashmat</title>
  <style>
    :root {
      --bg: #07090f;
      --card: #121826;
      --line: rgba(255,255,255,.12);
      --text: #f4f7ff;
      --muted: #8b97b0;
      --accent: #3dffb0;
      --blue: #6ea8ff;
      --warn: #ffcc4d;
      --danger: #ff5d73;
      --plus: #ffb020;
    }
    [data-theme="light"] {
      --bg: #eef2f8; --card: #fff; --line: rgba(20,30,50,.12);
      --text: #121826; --muted: #5b6780; --accent: #0db37a; --blue: #3b6cff;
      --warn: #d49200; --danger: #e03b55; --plus: #d48900;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    }
    header, .row, .after { display: flex; gap: 8px; align-items: center; }
    header select, header button, .times button, .after button, .sheet button, .sheet select, .sheet input {
      min-height: 44px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 0 10px;
      font: 600 14px system-ui;
    }
    header select { flex: 1; min-width: 0; }
    header button { width: 44px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px; flex: none;
      display: grid; place-items: center; font-weight: 800; color: #06110c;
      background: linear-gradient(145deg, #3dffb0, #2ad0ff);
    }
    .scramble, .pad, .times, .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .scramble {
      width: 100%;
      min-height: 58px;
      padding: 10px 12px;
      color: var(--text);
      text-align: center;
      font: 650 16px/1.35 ui-monospace, Menlo, Consolas, monospace;
      touch-action: manipulation;
    }
    .pad {
      width: 100%;
      min-height: 42vh;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      touch-action: manipulation;
      cursor: pointer;
    }
    .pill {
      font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    }
    #clock {
      font: 800 clamp(72px, 22vw, 112px)/.9 ui-monospace, Menlo, Consolas, monospace;
      margin: 10px 0 6px;
    }
    #clock.ready { color: #7dff6b; }
    #clock.inspect { color: var(--blue); }
    #clock.warn { color: var(--warn); }
    #clock.danger { color: var(--danger); }
    #clock.running { color: var(--accent); }
    .hint { color: var(--muted); font-size: 15px; text-align: center; padding: 0 12px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat { padding: 8px 4px; text-align: center; }
    .stat span { display: block; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .stat b { font: 700 15px ui-monospace, Menlo, Consolas, monospace; }
    .after { display: none; }
    .after.show { display: grid; grid-template-columns: repeat(4, 1fr); }
    .after button { width: 100%; }
    .after [data-act="plus"] { color: var(--plus); }
    .after [data-act="dnf"] { color: var(--danger); }
    .after [data-act="ok"] { color: var(--accent); }
    .times { flex: 1; min-height: 160px; display: flex; flex-direction: column; overflow: hidden; }
    .times-head { display: flex; justify-content: space-between; align-items: center; padding: 8px; }
    .times-head h2 { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .list { overflow: auto; -webkit-overflow-scrolling: touch; padding: 0 8px 8px; }
    .solve { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; min-height: 44px; padding: 0 8px; border-radius: 12px; }
    .solve.active { background: rgba(61,255,176,.14); }
    .solve .idx, .solve .meta { color: var(--muted); font-size: 12px; }
    .solve .t { font: 700 16px ui-monospace, Menlo, Consolas, monospace; }
    .solve .t.dnf { color: var(--danger); }
    .solve .t.plus { color: var(--plus); }
    dialog { border: 0; padding: 0; background: transparent; width: min(420px, 100%); }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    .sheet {
      margin: 0; background: var(--card); color: var(--text);
      border-radius: 22px 22px 0 0;
      padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
      display: grid; gap: 10px;
    }
    .sheet h3, .sheet p { margin: 0; }
    .sheet p { color: var(--muted); }
    .sheet label { display: grid; gap: 6px; }
    .check { display: flex; justify-content: space-between; align-items: center; }
    .done { background: var(--accent) !important; color: #06110c !important; border: 0 !important; }
    .toast {
      position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      padding: 10px 14px; border-radius: 999px; opacity: 0; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @media (min-width: 900px) {
      .app { max-width: 1100px; }
      .pad { min-height: 360px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">FM</div>
      <select id="eventSelect"></select>
      <select id="sessionSelect"></select>
      <button type="button" id="themeBtn">◐</button>
      <button type="button" id="settingsBtn">⚙</button>
    </header>
    <button type="button" class="scramble" id="scrambleBox"><span id="scrambleText">Ready</span></button>
    <button type="button" class="pad" id="timerPad">
      <span class="pill" id="statePill">Ready</span>
      <span id="clock">0.00</span>
      <span class="hint" id="hint">Tap the big number</span>
    </button>
    <div class="stats" id="statsRow"></div>
    <div class="after" id="afterBar">
      <button type="button" data-act="plus">+2</button>
      <button type="button" data-act="dnf">DNF</button>
      <button type="button" data-act="ok">OK</button>
      <button type="button" data-act="del">Delete</button>
    </div>
    <section class="times">
      <div class="times-head">
        <h2>Times <span id="countLabel">0</span></h2>
        <button type="button" id="nextScrambleBtn">New scramble</button>
      </div>
      <div class="list" id="solveList"></div>
    </section>
  </main>

  <dialog id="settingsDlg">
    <form method="dialog" class="sheet">
      <h3>Settings</h3>
      <label>Inspection
        <select id="inspSelect">
          <option value="0">Off</option>
          <option value="8">8s</option>
          <option value="15" selected>15s</option>
          <option value="17">17s</option>
        </select>
      </label>
      <label class="check">Sounds <input type="checkbox" id="soundToggle" checked /></label>
      <label class="check">Milliseconds <input type="checkbox" id="milliToggle" /></label>
      <button type="button" id="newSessionBtn">New session</button>
      <button type="button" id="exportBtn">Export CSV</button>
      <button type="button" id="addBtn">Add time</button>
      <button type="button" id="clearBtn">Clear session</button>
      <button class="done" value="close">Done</button>
    </form>
  </dialog>
  <dialog id="promptDlg">
    <form method="dialog" class="sheet" id="promptForm">
      <h3 id="promptTitle">Name</h3>
      <p id="promptText"></p>
      <input type="text" id="promptInput" autocomplete="off" />
      <div class="row">
        <button value="cancel">Cancel</button>
        <button class="done" value="ok">Save</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast"></div>
  <script>
    var FACES = ["U", "D", "L", "R", "F", "B"];
    var MODS = ["", "'", "2"];
    var EVENTS = {
      "333": { name: "3x3", moves: 20, faces: FACES, extra: [] },
      "222": { name: "2x2", moves: 9, faces: FACES, extra: [] },
      "444": { name: "4x4", moves: 40, faces: FACES, extra: ["Uw", "Rw", "Fw"] },
      "pyram": { name: "Pyra", moves: 11, faces: ["U", "L", "R", "B"], extra: [] },
      "skewb": { name: "Skewb", moves: 9, faces: ["U", "L", "R", "B"], extra: [] },
      "333oh": { name: "OH", moves: 20, faces: FACES, extra: [] }
    };
    var storeKey = "flashmat.mobilefix.v1";
    var state = { phase: "idle", inspectLeft: 15, inspectId: 0, startAt: 0, raf: 0, scramble: "", selectedId: null, lastBeep: "", pendingPenalty: null, lock: 0 };
    var defaultSettings = { theme: "dark", inspection: 15, sound: true, milli: false, event: "333" };
    var db = load();

    function load() {
      try {
        var raw = JSON.parse(localStorage.getItem(storeKey));
        if (raw && raw.sessions) return raw;
      } catch (e) {}
      var id = uid();
      return { settings: { theme: "dark", inspection: 15, sound: true, milli: false, event: "333" }, currentSession: id, sessions: [{ id: id, name: "Phone", event: "333", solves: [] }] };
    }
    function save() { try { localStorage.setItem(storeKey, JSON.stringify(db)); } catch (e) {} }
    function uid() { return Math.random().toString(36).slice(2, 10); }
    function session() {
      for (var i = 0; i < db.sessions.length; i++) if (db.sessions[i].id === db.currentSession) return db.sessions[i];
      return db.sessions[0];
    }
    function lastSolve() {
      var list = session().solves;
      return list.length ? list[list.length - 1] : null;
    }
    function toast(msg) {
      var el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show";
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { el.className = "toast"; }, 1400);
    }
    function beep(kind) {
      if (!db.settings.sound) return;
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        var ctx = beep.ctx || (beep.ctx = new Ctx());
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        var now = ctx.currentTime;
        o.frequency.value = kind === "go" ? 980 : 740;
        g.gain.setValueAtTime(0.05, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        o.start(now); o.stop(now + 0.13);
      } catch (e) {}
    }
    function rand(arr) { return arr[(Math.random() * arr.length) | 0]; }
    function generateScramble(eventId) {
      var ev = EVENTS[eventId] || EVENTS["333"];
      var pool = ev.faces.concat(ev.extra);
      var moves = [];
      var last = "";
      while (moves.length < ev.moves) {
        var face = rand(pool);
        if (face.charAt(0) === last) continue;
        last = face.charAt(0);
        moves.push(face + rand(MODS));
      }
      if (eventId === "pyram") {
        ["u", "l", "r", "b"].forEach(function (t) { if (Math.random() < 0.7) moves.push(t + rand(["", "'"])); });
      }
      return moves.join(" ");
    }
    function formatTime(ms, forceMilli) {
      if (ms == null) return "—";
      if (!isFinite(ms)) return "DNF";
      var milli = forceMilli || db.settings.milli;
      var abs = Math.max(0, ms);
      var m = Math.floor(abs / 60000);
      var s = Math.floor((abs % 60000) / 1000);
      var cs = Math.floor((abs % 1000) / (milli ? 1 : 10));
      var frac = milli ? String(cs).padStart(3, "0") : String(cs).padStart(2, "0");
      if (m > 0) return m + ":" + String(s).padStart(2, "0") + "." + frac;
      return s + "." + frac;
    }
    function effective(solve) {
      if (!solve || solve.penalty === "DNF") return Infinity;
      return solve.time + (solve.penalty === "+2" ? 2000 : 0);
    }
    function displaySolve(solve) {
      if (!solve) return "—";
      if (solve.penalty === "DNF") return "DNF";
      var t = formatTime(effective(solve));
      return solve.penalty === "+2" ? t + "+" : t;
    }
    function average(list, n, dropEach) {
      if (list.length < n) return null;
      var slice = list.slice(list.length - n).map(effective).sort(function (a, b) { return a - b; });
      var mid = slice.slice(dropEach, n - dropEach);
      for (var i = 0; i < mid.length; i++) if (!isFinite(mid[i])) return Infinity;
      var sum = 0;
      for (var j = 0; j < mid.length; j++) sum += mid[j];
      return sum / mid.length;
    }
    function bestOf(list) {
      var best = null;
      for (var i = 0; i < list.length; i++) {
        var v = effective(list[i]);
        if (isFinite(v) && (best == null || v < best)) best = v;
      }
      return best;
    }
    function setTheme(theme) {
      db.settings.theme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      save();
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function fillSelects() {
      var ev = document.getElementById("eventSelect");
      ev.innerHTML = Object.keys(EVENTS).map(function (id) { return '<option value="' + id + '">' + EVENTS[id].name + "</option>"; }).join("");
      ev.value = db.settings.event;
      var ss = document.getElementById("sessionSelect");
      ss.innerHTML = db.sessions.map(function (s) { return '<option value="' + s.id + '">' + escapeHtml(s.name) + "</option>"; }).join("");
      ss.value = session().id;
    }
    function newScramble() {
      state.scramble = generateScramble(db.settings.event);
      document.getElementById("scrambleText").textContent = state.scramble;
    }
    function renderStats() {
      var solves = session().solves;
      var cells = [
        ["Ao5", formatTime(average(solves, 5, 1))],
        ["Ao12", formatTime(average(solves, 12, 1))],
        ["Best", formatTime(bestOf(solves))],
        ["n", String(solves.length)]
      ];
      document.getElementById("statsRow").innerHTML = cells.map(function (c) {
        return "<div class='stat'><span>" + c[0] + "</span><b>" + c[1] + "</b></div>";
      }).join("");
    }
    function renderList() {
      var solves = session().solves;
      document.getElementById("countLabel").textContent = solves.length;
      var box = document.getElementById("solveList");
      if (!solves.length) {
        box.innerHTML = "<div class='solve'><span class='t' style='color:var(--muted)'>No times yet</span></div>";
        return;
      }
      var html = "";
      for (var i = solves.length - 1; i >= 0; i--) {
        var s = solves[i];
        var cls = s.penalty === "DNF" ? "dnf" : s.penalty === "+2" ? "plus" : "";
        var active = s.id === state.selectedId ? " active" : "";
        html += "<div class='solve" + active + "' data-id='" + s.id + "'><span class='idx'>" + (i + 1) + "</span><span class='t " + cls + "'>" + displaySolve(s) + "</span><span class='meta'>" + new Date(s.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + "</span></div>";
      }
      box.innerHTML = html;
    }
    function showAfter(id) {
      state.selectedId = id || null;
      document.getElementById("afterBar").className = id ? "after show" : "after";
      renderList();
    }
    function setPhase(phase, extra) {
      state.phase = phase;
      var pill = document.getElementById("statePill");
      var hint = document.getElementById("hint");
      var clock = document.getElementById("clock");
      if (phase === "idle") {
        pill.textContent = "Ready";
        clock.className = "";
        hint.textContent = db.settings.inspection > 0 ? "Tap the big number to inspect" : "Tap the big number to start";
      } else if (phase === "inspect") {
        pill.textContent = "Inspect";
        hint.textContent = "Tap again when you start turning";
      } else if (phase === "running") {
        pill.textContent = "Solving";
        clock.className = "running";
        hint.textContent = "Tap to stop";
      } else if (phase === "stopped") {
        pill.textContent = extra || "Logged";
        clock.className = "";
        hint.textContent = "Next scramble is ready";
      }
    }
    function clearTimers() {
      if (state.inspectId) clearInterval(state.inspectId);
      if (state.raf) cancelAnimationFrame(state.raf);
      state.inspectId = 0;
      state.raf = 0;
    }
    function startInspection() {
      clearTimers();
      var total = db.settings.inspection;
      if (!total) { startRun(); return; }
      state.inspectLeft = total;
      state.lastBeep = "";
      setPhase("inspect");
      var started = performance.now();
      function tick() {
        var clock = document.getElementById("clock");
        if (state.inspectLeft > 0) {
          clock.textContent = String(Math.max(0, Math.ceil(state.inspectLeft)));
          clock.className = state.inspectLeft <= 3 ? "danger" : state.inspectLeft <= 8 ? "warn" : "inspect";
          if (Math.ceil(state.inspectLeft) === 8 && state.lastBeep !== "8") { beep("eight"); state.lastBeep = "8"; }
        } else if (state.inspectLeft > -2) {
          clock.textContent = "+2";
          clock.className = "warn";
        } else {
          clock.textContent = "DNF";
          clock.className = "danger";
        }
      }
      tick();
      state.inspectId = setInterval(function () {
        state.inspectLeft = total - (performance.now() - started) / 1000;
        tick();
      }, 50);
    }
    function startRun() {
      clearTimers();
      var penalty = null;
      if (db.settings.inspection > 0 && state.phase === "inspect") {
        if (state.inspectLeft <= -2) penalty = "DNF";
        else if (state.inspectLeft <= 0) penalty = "+2";
      }
      state.pendingPenalty = penalty;
      state.startAt = performance.now();
      setPhase("running");
      beep("go");
      function loop() {
        if (state.phase !== "running") return;
        document.getElementById("clock").textContent = formatTime(performance.now() - state.startAt);
        state.raf = requestAnimationFrame(loop);
      }
      state.raf = requestAnimationFrame(loop);
    }
    function stopRun() {
      if (state.phase !== "running") return;
      var time = performance.now() - state.startAt;
      clearTimers();
      var solve = { id: uid(), time: Math.round(time), penalty: state.pendingPenalty || null, scramble: state.scramble, event: db.settings.event, at: Date.now() };
      session().solves.push(solve);
      save();
      document.getElementById("clock").textContent = displaySolve(solve);
      setPhase("stopped", solve.penalty === "DNF" ? "DNF" : "Logged");
      renderStats();
      showAfter(solve.id);
      newScramble();
      setTimeout(function () { if (state.phase === "stopped") setPhase("idle"); }, 350);
    }
    function onPadTap(e) {
      if (e && e.preventDefault) e.preventDefault();
      var now = Date.now();
      if (now - state.lock < 250) return;
      state.lock = now;
      if (state.phase === "running") stopRun();
      else if (state.phase === "inspect") startRun();
      else startInspection();
    }
    function setPenalty(solve, p) {
      if (!solve) return;
      solve.penalty = solve.penalty === p ? null : p;
      save(); renderStats(); renderList();
      if (solve === lastSolve() && state.phase === "idle") document.getElementById("clock").textContent = displaySolve(solve);
    }
    function deleteSolve(id) {
      session().solves = session().solves.filter(function (x) { return x.id !== id; });
      save();
      if (state.selectedId === id) showAfter(null);
      renderStats(); renderList();
      if (state.phase === "idle") document.getElementById("clock").textContent = lastSolve() ? displaySolve(lastSolve()) : "0.00";
    }
    function exportCsv() {
      var rows = [["index", "time_ms", "display", "penalty", "scramble", "event", "when"]];
      session().solves.forEach(function (s, i) {
        rows.push([i + 1, s.time, displaySolve(s), s.penalty || "", s.scramble, s.event, new Date(s.at).toISOString()]);
      });
      var csv = rows.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = "times.csv";
      a.click();
    }
    function promptText(title, text, value) {
      var dlg = document.getElementById("promptDlg");
      document.getElementById("promptTitle").textContent = title;
      document.getElementById("promptText").textContent = text;
      var input = document.getElementById("promptInput");
      input.value = value || "";
      dlg.showModal();
      setTimeout(function () { input.focus(); }, 30);
      return new Promise(function (resolve) {
        document.getElementById("promptForm").onsubmit = function (e) {
          e.preventDefault();
          var ok = e.submitter && e.submitter.value === "ok";
          dlg.close();
          resolve(ok ? input.value.trim() : null);
        };
      });
    }
    function renderAll() {
      fillSelects();
      renderStats();
      renderList();
      document.getElementById("inspSelect").value = String(db.settings.inspection);
      document.getElementById("soundToggle").checked = !!db.settings.sound;
      document.getElementById("milliToggle").checked = !!db.settings.milli;
      if (state.phase === "idle") document.getElementById("clock").textContent = lastSolve() ? displaySolve(lastSolve()) : "0.00";
    }
    function bind() {
      var pad = document.getElementById("timerPad");
      pad.addEventListener("click", onPadTap);
      document.addEventListener("keydown", function (e) {
        var tag = e.target && e.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (e.code === "Space") { e.preventDefault(); onPadTap(e); }
        if (e.key === "Escape" && state.phase === "inspect") {
          clearTimers();
          document.getElementById("clock").textContent = lastSolve() ? displaySolve(lastSolve()) : "0.00";
          setPhase("idle");
        }
      });
      document.getElementById("eventSelect").onchange = function (e) { db.settings.event = e.target.value; save(); newScramble(); };
      document.getElementById("sessionSelect").onchange = function (e) { db.currentSession = e.target.value; save(); renderAll(); };
      document.getElementById("themeBtn").onclick = function () { setTheme(db.settings.theme === "dark" ? "light" : "dark"); };
      document.getElementById("settingsBtn").onclick = function () { document.getElementById("settingsDlg").showModal(); };
      document.getElementById("nextScrambleBtn").onclick = newScramble;
      document.getElementById("scrambleBox").onclick = function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(state.scramble).then(function () { toast("Scramble copied"); }).catch(function () { toast(state.scramble); });
        } else toast(state.scramble);
      };
      document.getElementById("inspSelect").onchange = function (e) { db.settings.inspection = Number(e.target.value); save(); setPhase("idle"); };
      document.getElementById("soundToggle").onchange = function (e) { db.settings.sound = e.target.checked; save(); };
      document.getElementById("milliToggle").onchange = function (e) { db.settings.milli = e.target.checked; save(); renderAll(); };
      document.getElementById("newSessionBtn").onclick = function () {
        promptText("New session", "Name this session", "School").then(function (name) {
          if (!name) return;
          var s = { id: uid(), name: name, event: db.settings.event, solves: [] };
          db.sessions.push(s); db.currentSession = s.id; save(); fillSelects(); renderAll();
        });
      };
      document.getElementById("exportBtn").onclick = exportCsv;
      document.getElementById("addBtn").onclick = function () {
        promptText("Add a time", "Type seconds like 12.45", "").then(function (raw) {
          if (!raw) return;
          var n = Number(raw);
          if (!isFinite(n) || n <= 0) return toast("Could not read that time");
          session().solves.push({ id: uid(), time: Math.round(n * 1000), penalty: null, scramble: state.scramble, event: db.settings.event, at: Date.now() });
          save(); renderAll(); newScramble();
        });
      };
      document.getElementById("clearBtn").onclick = function () {
        promptText("Clear session", "Type CLEAR to delete times", "").then(function (ok) {
          if (ok !== "CLEAR") return;
          session().solves = []; save(); renderAll();
          document.getElementById("clock").textContent = "0.00";
          showAfter(null);
        });
      };
      document.getElementById("afterBar").onclick = function (e) {
        var act = e.target.getAttribute("data-act");
        var solve = null;
        var list = session().solves;
        for (var i = 0; i < list.length; i++) if (list[i].id === state.selectedId) solve = list[i];
        if (!solve || !act) return;
        if (act === "plus") setPenalty(solve, "+2");
        if (act === "dnf") setPenalty(solve, "DNF");
        if (act === "ok") { solve.penalty = null; save(); renderStats(); renderList(); }
        if (act === "del") deleteSolve(solve.id);
      };
      document.getElementById("solveList").onclick = function (e) {
        var row = e.target.closest ? e.target.closest(".solve") : null;
        if (row && row.getAttribute("data-id")) showAfter(row.getAttribute("data-id"));
      };
    }
    db.settings = Object.assign({}, defaultSettings, db.settings || {});
    setTheme(db.settings.theme || "dark");
    bind();
    newScramble();
    renderAll();
    setPhase("idle");
  </script>
</body>
</html>
